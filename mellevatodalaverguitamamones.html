<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Actividad de Mellevatoda</title>
    <style>
        /* From Uiverse.io by zjssun */
    @font-face {
      font-family: 'Calibri';
      src: url('media/calibri-font-family/calibri-regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      color-scheme: dark;
      font-family: 'Calibri', sans-serif;
      background-color: #000;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 90px 18px 36px;
      background: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 100%),
        linear-gradient(to right, #ff7300, #ffd900);
      color: #fff;
    }

    #topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 70px;
      width: 100%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: linear-gradient(
        to right,
        rgba(0, 255, 55, 0.5) 0%,
        rgba(255, 255, 255, 0.2) 50%,
        rgba(111, 0, 255, 0.5) 100%
      );
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0px;
      padding: 0 0px;
      z-index: 20;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0px;
    }

    .topbarlogo img,
    #topbar img {
      height: 44px;
      width: auto;
      display: block;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .nav a:hover,
    .nav a:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding-top: 24px;
    }

    .hero {
      padding: 90px 0 40px;
      text-align: center;
      max-width: 860px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(3rem, 4vw, 4.4rem);
      line-height: 1.02;
      margin: 0;
    }

    .hero p.subtitle,
    .hero p.description {
      margin: 16px auto 0;
      max-width: 720px;
      line-height: 1.6;
      color: #dcdcdc;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin: 48px auto 0;
      max-width: 1080px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .card a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card a.button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 14px;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer {
      margin-top: 48px;
      text-align: center;
      color: #bdbdbd;
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .footer strong {
      color: #fff;
    }

    .mobile-warning .page-content {
      display: none;
    }

    .mobile-message {
      display: none;
      max-width: 460px;
      margin: 140px auto 0;
      padding: 28px;
      border-radius: 24px;
      background: #f4f7fb;
      color: #111;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    .mobile-message h2 {
      margin: 0 0 14px;
      color: #111;
      font-size: 1.55rem;
    }

    .mobile-message p {
      margin: 0;
      color: #4a4a4a;
      line-height: 1.7;
    }

    .mobile-warning .mobile-message {
      display: block;
    }

    @media (max-width: 820px) {
      body {
        padding-top: 110px;
      }

      #topbar {
        flex-wrap: wrap;
        height: auto;
        padding: 16px;
      }

      .hero {
        padding-top: 40px;
      }
    }

    @media (max-width: 560px) {
      .hero h1 {
        font-size: 2.75rem;
      }

      .nav {
        width: 100%;
        justify-content: center;
      }
    }
    </style>
</head>
<body>
    <div id="topbar">
    <div class="topbar-left">
      <img src="index_resources/header_left.svg" alt="Header Left">
      <div class="topbarlogo">
        <img id="topbar-logo" src="index_resources/reality_engine_logo.png" alt="Reality Engine Logo">
      </div>
    </div>
    <div class="topbar-right">
      <nav class="nav">
        <a href="index.html">Index</a>
        <a href="legacy_index.html">Old Index</a>
      </nav>
      <img src="index_resources/header_right.svg" alt="Header Right">
    </div>
  </div>

    <main>
        <div class="hero">
            <h1>Actividad de info</h1>
            <p>Linea de tiempo en desuso</p>
        </div>

        <section class="content-card">
            <h2>Contexto del trabajo</h2>
            <p>basicamente iba a ser una tarea pero pus, no sucedio, en fin, esto esta aqui para ser archivado</p>
                <iframe src="https://cdn.knightlab.com/libs/timeline3/latest/embed/index.html?source=v2%3A2PACX-1vTOu0M-r5071YAOFsc4g1TsD8jugZEV5-PICHOHFxtpPIhw3WjSUdCv_5xfnwoH1mSonXn6M2ZA_l35"></iframe>

        </section>
    </main>
     <footer class="footer">
      <p><strong>SGI, Reality Engine, Onyx</strong> and the SGI PROM are property of Silicon Graphics International.</p>
    </footer>
</body>
</html>
